version: '3.8'
x-common:
  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_PASSWORD: &db-password ${MYSQL_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  panel:
    &panel-environment
    # This URL should be the URL that your reverse proxy routes to the panel server
    APP_URL: "https://pterodactyl.triserden.dev"
    # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "Europe/Amsterdam"
    APP_SERVICE_AUTHOR: "triserden@gmail.com"
    TRUSTED_PROXIES: "*" # Set this to your proxy IP
    # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
    # to generate an SSL certificate for the Panel.
    # LE_EMAIL: ""
  mail:
    &mail-environment
    MAIL_FROM: "noreply@example.com"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
  database:
    image: mariadb:10.5
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - external
    volumes:
      - "/data/pterodactyl/panel/srv/pterodactyl/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
  cache:
    image: redis:alpine
    restart: always
    networks:
      - external
  panel:
    container_name: pterodactyl_panel
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    links:
      - database
      - cache
    networks:
      - external
    volumes:
      - "/data/pterodactyl/panel/srv/pterodactyl/var/:/app/var/"
      - "/data/pterodactyl/panel/srv/pterodactyl/nginx/:/etc/nginx/http.d/"
      - "/data/pterodactyl/panel/srv/pterodactyl/certs/:/etc/letsencrypt/"
      - "/data/pterodactyl/panel/srv/pterodactyl/logs/:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "true"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
    labels:
      - "traefik.enable=true"
      - "expose-external=true"
      - "traefik.http.routers.pterodactylpanel.rule=Host(`pterodactyl.triserden.dev`)"
      - "traefik.http.routers.pterodactylpanel.entrypoints=websecure"
      - "traefik.http.routers.pterodactylpanel.tls.certresolver=cloudflare"
      - "traefik.docker.network=external"

networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16
  external:
    external: true

