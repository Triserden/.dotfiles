services:
  panel:
    image: ghcr.io/pelican-dev/panel:main
    restart: always
    networks:
      - external
      - default
    ports:
      - "25600-25625:25600-25625"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: "https://pelican.triserden.dev"
      ADMIN_EMAIL: "triserden@gmail.com"
    labels:
      - "traefik.enable=true"
      - "expose-external=true"
      - "traefik.http.routers.pelican.entrypoints=websecure"
      - "traefik.http.routers.pelican.rule=Host(`pelican.triserden.dev`)"
      - "traefik.http.routers.pelican.tls=true"
      - "traefik.http.routers.pelican.tls.certresolver=http"
      - "traefik.docker.network=external"

volumes:
  pelican-data:
  pelican-logs:

networks:
  external:
    name: external
    external: true
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
