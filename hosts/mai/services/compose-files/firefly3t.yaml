name: firefly3
services:
  app:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly_iii_core
    restart: unless-stopped
    volumes:
      - /data/firefly3/firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firefly3.rule=Host(`firefly3.local.triserden.dev`)"
      - "traefik.http.routers.firefly3.entrypoints=websecure"
      - "traefik.http.routers.firefly3.tls.certresolver=cloudflare"
      - "traefik.http.services.firefly3.loadbalancer.server.port=8080"
      -  "compose2nix.settings.sops.secrets=services/firefly3.env"

  importer:
    image: fireflyiii/data-importer:latest
    hostname: importer
    restart: unless-stopped
    container_name: firefly_iii_importer
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fireflyimporter.rule=Host(`fireflyimporter.local.triserden.dev`)"
      - "traefik.http.routers.fireflyimporter.entrypoints=websecure"
      - "traefik.http.routers.fireflyimporter.tls.certresolver=cloudflare"
      - "traefik.http.services.fireflyimporter.loadbalancer.server.port=8080"
      - "compose2nix.settings.sops.secrets=services/firefly3importer.env"

  db:
    image: mariadb:lts
    hostname: db
    container_name: firefly_iii_db
    # command: ["mariadbd", "--tc-heuristic-recover=commit"]
    restart: unless-stopped
    labels:
      - "compose2nix.settings.sops.secrets=services/firefly3database.env"
    volumes:
      - /data/firefly3/firefly_iii_db:/var/lib/mysql
  cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable and replace REPLACEME below
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    #
    image: alpine
    restart: always
    container_name: firefly_iii_cron
    command: sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/qhVIM2943RYIhfhxklDhWxi4BSkJA1U8\" | crontab - && crond -f -L /dev/stdout"

networks:
  default:
    name: internal
    external: true
