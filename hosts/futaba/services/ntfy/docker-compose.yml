services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    user: 1000:1000 # optional: replace with your own user/group or uid/gid
    volumes:
      - /data/ntfy/var/cache/ntfy:/var/cache/ntfy
      - /data/ntfy/var/lib/ntfy:/var/lib/ntfy
      - /data/ntfy/etc/ntfy:/etc/ntfy
    environment:
      - NTFY_BASE_URL="https://ntfy.local.triserden.dev"
      - TZ=Europe/Amsterdam    # optional: set desired timezone
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ENABLE_LOGIN =true
      - NTFY_UPSTREAM_BASE_URL="https://ntfy.sh"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.local.triserden.dev`)"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.routers.ntfy.tls.certresolver=cloudflare"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
      - "traefik.http.middlewares.ntfy-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ntfy-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.ntfy.middlewares=ntfy-redirect"
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped

networks:
  default:
    name: internal
    external: true
