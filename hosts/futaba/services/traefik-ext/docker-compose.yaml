version: "3.3"

services:
  traefik:
    image: "traefik:v3.1"
    container_name: "traefik-ext"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entryPoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.docker.constraints=Label(`expose-external`,`true`)"
      - "--entryPoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,192.168.1.7"
      - "--certificatesresolvers.http.acme.email=triserden@gmail.com"
      - "--certificatesresolvers.http.acme.storage=acme.json"
      - "--certificatesresolvers.http.acme.caServer = https://acme-staging.api.letsencrypt.org/directory"
      - "--certificatesresolvers.http.acme.httpchallenge.entrypoint=web"
    labels:
      - "traefik.http.middlewares.corsheader.headers.accesscontrolallowmethods=GET,OPTIONS,PUT"
      - "traefik.http.middlewares.corsheader.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.corsheader.headers.accesscontrolalloworiginlist=https://pterodactyl.triserden.dev,https://node1.pterodactyl.triserden.dev"
      - "traefik.http.middlewares.corsheader.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.corsheader.headers.addvaryheader=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/data/traefik/letsencrypt-ext:/letsencrypt"
    environment: 
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    restart: unless-stopped
    ports:
      - "${server_ip}:80:80"
      - "${server_ip}:443:443"

networks:
  default:
    name: external
    external: true
