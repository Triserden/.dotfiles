x-common:
  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_PASSWORD: &db-password ${MARIADB_PASS}
    MYSQL_ROOT_PASSWORD: ${MARIADB_ROOTPASS}
  panel:
    &panel-environment
    APP_URL: "https://pterodactyl.triserden.dev"
    # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "CEST"
    APP_SERVICE_AUTHOR: "triserden@gmail.com"
    # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
    # to generate an SSL certificate for the Panel.
    # LE_EMAIL: ""
  mail:
    &mail-environment
    MAIL_FROM: "noreply@example.com"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
  database:
    image: mariadb:10.5
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "/srv/pterodactyl/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"

  cache:
    image: redis:alpine
    restart: always

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: always
    networks:
      - default
      - ptero-wings0
    tty: true
    environment:
      TZ: "UTC"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pterodactyl
    volumes:
      - "/data/pterodactyl/wings/var/run/docker.sock:/var/run/docker.sock"
      - "/data/pterodactyl/wings/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/data/pterodactyl/wings/etc/pterodactyl/:/etc/pterodactyl/"
      - "/data/pterodactyl/wings/var/lib/pterodactyl/:/var/lib/pterodactyl/"
      - "/data/pterodactyl/wings/var/log/pterodactyl/:/var/log/pterodactyl/"
      - "/tmp/pterodactyl/:/tmp/pterodactyl/"
      - "/data/pterodactyl/wings/etc/ssl/certs:/etc/ssl/certs:ro"
      # you may need /srv/daemon-data if you are upgrading from an old daemon
      #- "/srv/daemon-data/:/srv/daemon-data/"
      # Required for ssl if you use let's encrypt. uncomment to use.
      #- "/etc/letsencrypt/:/etc/letsencrypt/"

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    networks:
      - default
    links:
      - database
      - cache
    volumes:
      - "/data/pterodactyl/panel/srv/pterodactyl/var/:/app/var/"
      - "/data/pterodactyl/panel/srv/pterodactyl/nginx/:/etc/nginx/http.d/"
      - "/data/pterodactyl/panel/srv/pterodactyl/certs/:/etc/letsencrypt/"
      - "/data/pterodactyl/panel/srv/pterodactyl/logs/:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
    labels:
      - "traefik.enable=true"
      - "expose-external=true"
      - "traefik.http.routers.pterodactyl.entrypoints=websecure"
      - "traefik.http.routers.pterodactyl.rule=Host(`pterodactyl.triserden.dev`)"
      - "traefik.http.routers.pterodactyl.tls=true"
      - "traefik.http.routers.pterodactyl.tls.certresolver=http"
      - "traefik.docker.network=external"

networks:
    default:
        name: external
        external: true
    ptero-wings0:
      name: ptero-wings0
      driver: bridge
      ipam:
        config:
          - subnet: "172.30.0.0/16"
      driver_opts:
        com.docker.network.bridge.name: ptero-wings0

